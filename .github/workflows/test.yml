name: tests

on:
  push:
    branches: [main, staging, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies to install — the suite runs on node:test alone.
      - run: npm test
